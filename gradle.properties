# JVM args for the Gradle daemon.
# preferIPv4Stack: this host has broken IPv6 egress; the JVM otherwise blocks on
# IPv6 connects to Maven/Google repos until timeout. Harmless on dual-stack hosts.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
sonara.google.web.client.id=817950906051-doufag33qkd2c7tgkpg090iegiphdjdq.apps.googleusercontent.com
