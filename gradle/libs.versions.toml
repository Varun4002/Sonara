[versions]
# Build tooling
agp = "9.3.2"
# Kotlin: matches AGP 9.3.2's built-in Kotlin (KGP 2.2.10). The Compose and
# serialization COMPILER plugins must equal this; AGP compiles Kotlin itself,
# so there is no separate kotlin-android plugin.
kotlin = "2.2.10"

# AndroidX core / lifecycle / compose
# NOTE: newest lines (core 1.19.x, lifecycle 2.11.x) require compileSdk >= 37,
# which is unavailable on this machine's SDK repo; pinned to the newest that
# accept compileSdk 36.
coreKtx = "1.18.0"
splashscreen = "1.2.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
# 2026.08.00 pulls Compose 1.12.x which demands compileSdk >= 37; this project
# is pinned to compileSdk 36, so use the newest BOM still on Compose 1.11.
composeBom = "2026.05.01"

# Material icon sets. No longer managed by the BOM (frozen at 1.7.x), so the
# version is pinned explicitly here.
materialIcons = "1.7.8"

# Media / data
media3 = "1.11.0"
palette = "1.0.0"
datastore = "1.2.1"
coroutines = "1.11.0"
serializationJson = "1.11.0"
# okhttp 5.5.0 requires compileSdk >= 37; 5.4.0 accepts 36.
okhttp = "5.4.0"
# 3.5.x is built with Kotlin 2.4 (metadata unreadable by the 2.2.10 compiler
# that AGP 9.3.2 ships). 3.3.0 is the newest line compatible with this build.
coil = "3.3.0"

# Testing
junit = "4.13.2"
truth = "1.4.5"
turbine = "1.2.1"
robolectric = "4.16.1"
androidxJunit = "1.3.0"
espresso = "3.7.0"
archCoreTesting = "2.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Compose (versions come from the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }

# Media3
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }

# Data / networking / images
androidx-palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCoreTesting" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
